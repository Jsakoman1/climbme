non_goals:
- Calling this redesign a native iPhone app or a production release.
- Treating a local 390px viewport as proof of all physical iPhone/Safari behavior.
- Using process telemetry to retain user records, prompts, code excerpts or personal
  context.
closeout_readback:
  local_evidence: The approved presentation scope has local unit, build and three
    synthetic 390px browser proofs. It preserves the existing protected data/API behavior.
  retained_learning: Only aggregate process observations are retained; no climbing,
    account, conversation, code-excerpt or tool-output content is part of closeout.
  residual_owner_gate: CLIMBME-MOB-001 physical iPhone/Safari usability check.
