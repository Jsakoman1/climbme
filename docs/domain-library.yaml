invariants:
- id: declared-permission-intent
  description: Each authenticated climber can create, view, correct and delete only
    their own climbing and training data.
permission_rules:
- id: declared-permission
  actor: Registered climbers who want private performance tracking.
  action: Each authenticated climber can create, view, correct and delete only their
    own climbing and training data.
  boundary: Permission details require explicit review before implementation.
workflows:
- id: declared-workflow
  initial_state: not-declared
  transitions:
  - from: not-declared
    to: review-required
    action: A visitor registers and signs in, then records a private attempt and sees
      it persist in their own chronological log.
acceptance_scenarios:
- id: first-capability-intent
  given: Climbers need a fast, private way to retain attempt history and see performance
    progression without a paid or confusing logbook.
  when: Record and review one private climbing attempt
  then: The project records the owner-confirmed full V1 scope, authority boundaries,
    unresolved public-launch policies and one serial delivery shape without implementing
    product behavior.
