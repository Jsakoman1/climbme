kind: dora_domain_library
version: 1
vocabulary:
- id: account
  description: One authenticated ClimbMe user with a unique email and private performance data.
- id: canonical-email
  description: The trimmed lower-case account lookup key supplied by Auth Foundation v0.3; it does not create a shared account identity.
- id: climbing-attempt
  description: One dated attempt on one named route at a location and sector; it is the primary record in the climbing log.
- id: route-projection
  description: A per-user derived view that groups attempts by normalized route identity and shows first attempt, send outcome, total attempts and current status.
- id: french-grade
  description: One explicit ordered French sport grade label from the V1 catalog; it is not a conversion from another grade system.
- id: training-session
  description: One dated training, rest or mobility session with duration and optional subjective component scores.
- id: dashboard-metric
  description: A deterministic per-user aggregate with a documented formula and no cross-user data.
- id: achievement
  description: A derived milestone such as first redpoint or onsight at a new highest French grade.
entities:
- id: user
  description: Owns all attempts, route projections, training sessions, metrics and achievements returned to an authenticated session.
- id: climbing_attempt
  description: Persisted private attempt record; its fields preserve the climber-entered route context and result.
- id: training_session
  description: Persisted private training or recovery record.
- id: grade_catalog_entry
  description: Application-owned ordered French sport-grade definition used only for supported V1 analytics.
invariants:
- id: private-user-isolation
  description: Every service query and mutation scopes records to the authenticated user; client-provided user identifiers never grant access.
- id: local-account-security
  description: Passwords are stored only as BCrypt hashes. New registration and authenticated password changes require the Auth Foundation v0.3 15-Unicode-code-point single-factor policy, while existing stored hashes remain valid for sign-in. Browser mutations require a CSRF token, sessions are server-side, repeated failed local account attempts are temporarily limited per client address, and account lookup uses the package-supplied canonical email.
- id: attempt-primary-record
  description: A climbing-log row is one attempt, not one route or one session. Route views and dashboard totals derive from attempts.
- id: no-route-duplication
  description: A user creates an attempt; Route Database fields derive from the same private attempts and do not require a duplicate route-maintenance form.
- id: bounded-route-correction
  description: A route's normal status is derived from attempts. The only V1 manual correction is an owner-scoped ABANDONED marker keyed to that owner's existing route identity; it does not create a separate route record.
- id: explicit-grade-order
  description: Grade ordering uses the declared French catalog, never lexical string comparison or inferred cross-scale mapping.
- id: send-semantics
  description: Send outcome is explicit. PROJECT records an unsuccessful working attempt; a successful later ascent records its actual sent style such as REDPOINT.
- id: attempt-entry-ownership
  description: The browser submits only climbing fields. The backend gets the user identity from the authenticated session and never accepts a client-selected owner.
- id: attempt-number-default
  description: When a climber does not enter an attempt number, the backend assigns the next number only among that owner's matching location, sector and route name; it never derives it from another account.
- id: private-partner-data
  description: Partner text is private contextual data and is never exposed to another user or used for public analytics.
- id: private-training-isolation
  description: Training sessions belong only to their authenticated owner and are never used to alter climbing-attempt history.
- id: derived-achievement-safety
  description: Achievements derive from a user's own eligible sent attempts and do not mutate the source attempt.
permission_rules:
- id: anonymous-registration
  actor: Anonymous visitor
  action: Register one account and sign in with valid credentials.
  boundary: Duplicate or invalid registration creates no account; rate limits and CSRF protections apply.
- id: private-performance-owner
  actor: Authenticated climber
  action: Create, read, update, delete and export only their own attempts and training sessions; read only their own derived analytics.
  boundary: Another account's identifiers, route names, partner text and analytic aggregates are never readable or mutable.
- id: account-data-rights
  actor: Authenticated climber
  action: Download their own JSON export or permanently delete their account after confirming its current password.
  boundary: Export includes only records owned by that account; deletion removes only that account's attempts, training sessions and route-status corrections, then invalidates its session.
workflows:
- id: climbing-attempt-lifecycle
  initial_state: absent
  transitions:
  - from: absent
    to: recorded
    action: Authenticated climber saves a valid private attempt.
  - from: recorded
    to: recorded
    action: Owner corrects a valid attempt without changing another account's data.
  - from: recorded
    to: deleted
    action: Owner explicitly deletes the attempt; derived route and dashboard views recalculate.
- id: session-lifecycle
  initial_state: anonymous
  transitions:
  - from: anonymous
    to: authenticated
    action: Visitor registers or signs in with valid credentials.
  - from: authenticated
    to: anonymous
    action: User signs out or the server session expires.
acceptance_scenarios:
- id: private-attempt-round-trip
  given: A registered climber has signed in.
  when: They save a valid French-grade climbing attempt and refresh the web application.
  then: They see it in their own chronological log and another account cannot read it.
- id: phone-first-attempt-entry
  given: A signed-in climber is using an iPhone-width responsive viewport.
  when: They open the Log section to record one climbing attempt.
  then: Date, location, sector, route name, grade, style and send remain visibly labelled; optional performance context is progressively disclosed and saving preserves the existing private attempt workflow.
- id: no-duplicate-route-entry
  given: A climber has recorded attempts for one route.
  when: They view Route Database.
  then: First-attempt date, send date, total attempts, sent style and status derive from those attempts.
- id: mobile-route-history
  given: A signed-in climber is using the Routes section at iPhone width.
  when: They inspect a route derived from private attempts.
  then: Route identity, grade, first try, send date, attempt count and derived status remain readable, and the existing Abandon action does not create a separate route record.
- id: mobile-training-history
  given: A signed-in climber is using the Training section at iPhone width.
  when: They add or inspect a private training session.
  then: The existing date, type, duration and optional strength/endurance/mobility context remain readable and the session stays private to its owner.
- id: mobile-insights
  given: A signed-in climber is using the Insights section at iPhone width.
  when: They inspect private dashboard results.
  then: Existing KPI labels/values, chart labels/values and achievements remain visible without changing the dashboard response, grade ordering or metric formulas.
- id: analytics-precise-labels
  given: A climber has attempts and sends across grades and dates.
  when: They view Dashboard.
  then: It separately reports attempt volume, sends, unique routes, climbing days and configured grade-based aggregates.
- id: analytics-visual-and-readable
  given: A climber has private dashboard values.
  when: They view the responsive Dashboard.
  then: Each chart retains its visible labels and values while showing a proportional visual bar derived only from the protected dashboard response.
