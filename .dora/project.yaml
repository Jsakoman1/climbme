kind: dora_project_adapter
version: 1
project:
  id: climbme
  root: ".."
paths:
  docs: docs
  work_plans: docs/work
  audit_output: docs/audit-output
  runtime_evidence: docs/runtime-evidence
commands:
  work_start: "./bin/dora work-start .dora/project.yaml plan=<work-plan> task=<task-id>"
  work_verify: "./bin/dora work-verify .dora/project.yaml plan=<work-plan> task=<task-id>"
  control_check: "./bin/dora doctor .dora/project.yaml"
distribution:
  method: locked_local_cli
  lock_path: dora.lock.yaml
  release_version: v1.16.4
  source_commit: ef8c36f6bb9457f85627d17bac5fc2607c1033e2
  package_checksum: fdf1f089a14f826231e42cd2704ca960e97774182ff14e754b1a4eabaf8cedac
  cache_layout: user_application_support_v1
  update_command: Use Dora locked-cli-rotation-preview and an owner-approved exact rotation record; do not use a checkout, PATH fallback or live network source.
  rollback_rule: Restore the prior exact lock and matching adapter identity through the same reviewed rotation path, or revert the isolated Dora lock commit.
extensions:
- id: project-documentation
  category: documentation
  paths:
  - docs
  invocation: project-defined documentation checks
