server.port=${PORT:8080}
spring.datasource.url=${JDBC_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:${POSTGRES_PORT:5432}}/${PGDATABASE:${POSTGRES_DB:app}}}}
spring.datasource.username=${PGUSER:${POSTGRES_USER:app}}
spring.datasource.password=${PGPASSWORD:${POSTGRES_PASSWORD:}}
spring.flyway.enabled=true
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
climbme.operations.secure-cookies=${CLIMBME_OPERATIONS_SECURE_COOKIES:false}
